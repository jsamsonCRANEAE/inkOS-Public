; InkOS — custom firmware for the Xteink X4 (ESP32-C3, 800x480 SSD1677 e-paper)
; Build:   pio run
; Output:  .pio/build/x4/firmware.bin  -> flash with the web "Custom .bin" / OTA tool
;          (do NOT use `pio run -t upload` until you've backed up the stock flash:
;           a USB upload rewrites the bootloader + partition table)

[env:x4]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os
    -Wall
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9

[env:native]
; Host-side unit tests for the hardware-independent logic (calendar math, button decoding)
platform = native
build_src_filter = -<*>
test_build_src = no
